title: "[Show & Tell] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your Cadenza setup! Fill in what's relevant — not every field applies to everyone.

  - type: input
    id: keyboard
    attributes:
      label: Keyboard
      description: Which board are you running Cadenza on?
      placeholder: "Corne Choc v2, nice!nano, handwired..."
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: Firmware version
      description: Which .vil file or QMK commit?
      placeholder: "Cadenza-Corne-Pro_v0_6_1.vil"
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: false

  - type: textarea
    id: modifications
    attributes:
      label: Modifications
      description: What did you change from the base layout?
      placeholder: "Swapped X and Y, changed tipping terms on ring fingers to 280ms, added German umlaut macros..."
    validations:
      required: false

  - type: textarea
    id: experience
    attributes:
      label: Experience
      description: How has it been? First impressions, after a week, after a month — whatever stage you're at.
      placeholder: "Week 3 — L9 is now muscle memory, still fumbling with bracket layer under pressure..."
    validations:
      required: false

  - type: input
    id: wpm
    attributes:
      label: WPM before → after
      description: Optional — only if you have measured data
      placeholder: "72 WPM QWERTY → 58 WPM Cadenza week 1 → 81 WPM Cadenza month 2"
    validations:
      required: false

  - type: textarea
    id: photo
    attributes:
      label: Photo or screenshot
      description: Drag and drop an image of your build or layer config here. Not required but strongly encouraged.
    validations:
      required: false

  - type: textarea
    id: tips
    attributes:
      label: Tips for others
      description: Anything you wish you'd known when starting?
    validations:
      required: false
